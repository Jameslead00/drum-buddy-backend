version: 1
backend:
  phases:
    build:
      commands:
        - npm install --legacy-peer-deps --no-audit --no-fund --cache .npm --prefer-offline
        - CI=1 npx ampx pipeline-deploy --branch main --app-id dqxubwafnmvt3 --outputs-out-dir .
frontend:
  phases:
    build:
      commands:
        - echo 'Native iOS app; no hosted frontend to build'
  artifacts:
    baseDirectory: .
    files:
      - README.md
  cache:
    paths:
      - .npm/**/*
