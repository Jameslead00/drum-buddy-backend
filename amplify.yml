version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --legacy-peer-deps --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo 'Native iOS app; no hosted frontend to build'
  artifacts:
    baseDirectory: .
    files:
      - README.md
  cache:
    paths:
      - .npm/**/*
